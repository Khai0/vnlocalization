<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VNlocalization Admin</title>
<style>
:root{--ink:#1c2523;--mut:#6b7774;--line:#dde2df;--acc:#2f6f5e;--dark:#172b2a}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;height:100vh;display:grid;grid-template-rows:52px minmax(0,1fr);grid-template-columns:230px minmax(0,1fr) 300px;font:14px/1.45 system-ui,"Segoe UI",sans-serif;color:var(--ink);background:#f4f5f3}
header{grid-column:1/-1;background:var(--dark);color:#fff;display:flex;align-items:center;gap:8px;padding:0 14px}
header .mut{color:#9db3ae;font-size:12px}.sp{flex:1}
button,select,input,textarea{font:inherit}
button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 10px;cursor:pointer}
header button,header select{background:#244240;color:#fff;border-color:#3a5b58}
header a{color:#cfe6df;text-decoration:none;font-size:13px}
button.on{background:var(--acc)!important;color:#fff!important;border-color:var(--acc)!important}
.primary{background:var(--acc)!important;color:#fff!important;border-color:var(--acc)!important;font-weight:600}
.danger{color:#b3261e}
aside{background:#fff;border-right:1px solid var(--line);overflow:auto;padding:8px}
aside h4{margin:12px 6px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
aside a{display:block;padding:5px 8px;border-radius:6px;cursor:pointer}
aside a:hover{background:#eef2f0}aside a.on{background:#dcebe5;font-weight:600}
#rep{width:100%;margin-top:14px}
main{display:flex;padding:12px;min-height:0}
#wrap{flex:1;display:flex;justify-content:center;min-height:0}
#fr{width:100%;height:100%;border:1px solid var(--line);background:#fff;border-radius:8px}
#code{flex:1;font:12.5px/1.5 ui-monospace,Consolas,monospace;border:1px solid var(--line);border-radius:8px;padding:10px;resize:none;tab-size:2;white-space:pre}
#side2{background:#fff;border-left:1px solid var(--line);overflow:auto;padding:12px}
#side2 h3{margin:16px 0 4px;font-size:13px}#side2 h3:first-child{margin-top:0}
label{display:block;margin:8px 0;font-size:12px;color:var(--mut)}
label input,label textarea{display:block;width:100%;margin-top:3px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;color:var(--ink)}
.pv{max-width:100%;max-height:120px;border:1px solid var(--line);border-radius:6px;display:block;margin:6px 0}
.tag{font:12px ui-monospace,monospace;background:#eef2f0;display:inline-block;padding:2px 6px;border-radius:4px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.btn2{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;color:var(--ink);margin:4px 0}
.mut{color:var(--mut)}
dialog{border:1px solid var(--line);border-radius:10px;width:min(480px,92vw)}
dialog pre{background:#f4f5f3;padding:8px;border-radius:6px;max-height:200px;overflow:auto;white-space:pre-wrap;font-size:12px}
</style>
</head>
<body>
<header>
  <b>VNlocalization Admin</b><span id="cur" class="mut"></span><span class="sp"></span>
  <span id="vp"><button data-w="100%" class="on" title="Máy tính">💻</button> <button data-w="768px" title="Máy tính bảng">▭</button> <button data-w="390px" title="Điện thoại">📱</button></span>
  <span id="modes"><button data-m="visual" class="on">Trực quan</button> <button data-m="code">Mã HTML</button></span>
  <select id="hist"><option value="">Lịch sử</option></select>
  <a id="view" href="#" target="_blank">Xem trang ↗</a>
  <span id="status" class="mut"></span>
  <button id="save" class="primary">Lưu (Ctrl+S)</button>
</header>
<aside><div id="list"></div><button id="rep">Tìm &amp; thay thế toàn site</button></aside>
<main>
  <div id="wrap"><iframe id="fr"></iframe></div>
  <textarea id="code" hidden spellcheck="false"></textarea>
</main>
<div id="side2">
  <h3>Phần tử đang chọn</h3><div id="props"></div>
  <h3>SEO trang này</h3>
  <label>Tiêu đề (title)<input id="s-title"></label>
  <label>Mô tả (description)<textarea id="s-desc" rows="3"></textarea></label>
  <label>og:title<input id="s-ogt"></label>
  <label>og:description<textarea id="s-ogd" rows="2"></textarea></label>
</div>
<dialog id="dlg">
  <h3>Tìm &amp; thay thế toàn site</h3>
  <p class="mut" style="font-size:12px;margin:0">Ví dụ đổi email, số điện thoại, tên miền trên mọi trang. Có sao lưu trước khi ghi.</p>
  <label>Tìm<input id="r-find"></label>
  <label>Thay bằng<input id="r-with"></label>
  <label>Phạm vi<select id="r-scope"><option value="all">Tất cả</option><option value="vi">Tiếng Việt</option><option value="en">English</option><option value="zh">中文</option><option value="ja">日本語</option><option value="ko">한국어</option></select></label>
  <pre id="r-out"></pre>
  <div class="row"><button id="r-prev">Xem trước</button><button id="r-do" class="primary">Áp dụng</button><button id="r-x">Đóng</button></div>
</dialog>
<script>
const $=s=>document.querySelector(s),fr=$('#fr'),ta=$('#code'),H={'X-Admin':'1'};
const LANG={vi:'Tiếng Việt',en:'English',zh:'中文',ja:'日本語',ko:'한국어',root:'Gốc (bản EN sao chép)'};
const EDCSS='*,*::before,*::after{animation:none!important;transition:none!important}[contenteditable]{cursor:text;outline-offset:2px}[contenteditable]:hover{outline:1px dashed #4f8cff}.ed-sel{outline:2px solid #2f6fff!important;outline-offset:2px}img{cursor:pointer}img:hover{outline:2px dashed #4f8cff}';
let cur=null,dirty=false,mode='visual',sel=null;
const isCss=()=>/\.css$/.test(cur||'');
const esc=s=>(s||'').replace(/[&"<>]/g,c=>({'&':'&amp;','"':'&quot;','<':'&lt;','>':'&gt;'}[c]));
const api=async(u,o={})=>{const r=await fetch(u,o);if(!r.ok){let m;try{m=(await r.json()).error}catch{}throw new Error(m||r.statusText)}return r};
function status(t,err){const s=$('#status');s.textContent=t;s.style.color=err?'#ff9a9a':'#9fd8c4'}
function mark(){dirty=true;status('● Chưa lưu')}

async function init(){
  const {pages,css}=await (await api('/api/pages')).json(),g={};
  pages.forEach(p=>{const k=/^(en|vi|zh|ja|ko)\//.test(p)?p.slice(0,2):'root';(g[k]=g[k]||[]).push(p)});
  let h='';
  for(const k of ['vi','en','zh','ja','ko','root'])if(g[k])h+=`<h4>${LANG[k]}</h4>`+g[k].map(p=>{let s=(k==='root'?p:p.slice(3)).replace(/index\.html$/,'');return `<a data-p="${p}">${s?'/'+s:'Trang chủ'}</a>`}).join('');
  h+='<h4>Giao diện (CSS)</h4>'+css.map(p=>`<a data-p="${p}">${p.split('/').pop()}</a>`).join('');
  $('#list').innerHTML=h;
  $('#list').onclick=e=>{const a=e.target.closest('a[data-p]');if(a)open(a.dataset.p)};
  const first=(g.vi&&g.vi[0])||pages[0];if(first)open(first);
}

async function open(p){
  if(dirty&&!confirm('Bỏ các thay đổi chưa lưu?'))return;
  const txt=await (await api('/api/file?path='+encodeURIComponent(p))).text();
  cur=p;dirty=false;status('');
  $('#cur').textContent=p;
  document.querySelectorAll('#list a').forEach(a=>a.classList.toggle('on',a.dataset.p===p));
  $('#view').href=isCss()?'#':'/'+p.replace(/index\.html$/,'');
  $('#modes').hidden=isCss();$('#vp').hidden=isCss();
  if(isCss()){ta.value=txt;ta.dataset.orig=txt;setMode('code',true)}else{setSource(txt);setMode('visual',true)}
  loadHist();
}

function setSource(html){
  const d=new DOMParser().parseFromString(html,'text/html');
  d.querySelectorAll('script').forEach(s=>{if(s.hasAttribute('type'))s.dataset.edType=s.getAttribute('type');else s.dataset.edNone='';s.setAttribute('type','text/x-disabled')});
  const dir=cur.includes('/')?cur.slice(0,cur.lastIndexOf('/')+1):'';
  d.head.insertAdjacentHTML('afterbegin',`<base data-ed href="/${dir}"><style data-ed>${EDCSS}</style>`);
  sel=null;panel();
  fr.srcdoc='<!doctype html>'+d.documentElement.outerHTML;
}

function serialize(){
  const d=fr.contentDocument.documentElement.cloneNode(true);
  d.querySelectorAll('[data-ed]').forEach(n=>n.remove());
  d.querySelectorAll('[contenteditable]').forEach(n=>n.removeAttribute('contenteditable'));
  d.querySelectorAll('.ed-sel').forEach(n=>{n.classList.remove('ed-sel');if(!n.className)n.removeAttribute('class')});
  d.querySelectorAll('script[type="text/x-disabled"]').forEach(s=>{
    if(s.hasAttribute('data-ed-none'))s.removeAttribute('type');else s.setAttribute('type',s.getAttribute('data-ed-type'));
    s.removeAttribute('data-ed-none');s.removeAttribute('data-ed-type');
  });
  return '<!doctype html>\n'+d.outerHTML+'\n';
}

fr.onload=()=>{
  const d=fr.contentDocument;if(!d||!d.body)return;
  const skip=/^(SCRIPT|STYLE|NOSCRIPT|TEXTAREA|SELECT|OPTION|INPUT|SVG|PATH|BR|IMG)$/i;
  d.body.querySelectorAll('*').forEach(el=>{
    if(skip.test(el.tagName)||el.closest('svg'))return;
    if([...el.childNodes].some(n=>n.nodeType===3&&n.nodeValue.trim()))el.setAttribute('contenteditable','true');
  });
  d.addEventListener('click',e=>{if(e.target.closest('a,button,summary,label,form'))e.preventDefault();pick(e.target)},true);
  d.addEventListener('submit',e=>e.preventDefault());
  d.addEventListener('input',mark);
  d.addEventListener('paste',e=>{e.preventDefault();d.execCommand('insertText',false,e.clipboardData.getData('text/plain'))});
  d.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();d.execCommand('insertLineBreak')}
    if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();save()}
  });
  fillSeo();
};

function pick(el){
  const d=fr.contentDocument;
  d.querySelectorAll('.ed-sel').forEach(n=>{n.classList.remove('ed-sel');if(!n.className)n.removeAttribute('class')});
  if(!el||el.nodeType!==1||el===d.body||el===d.documentElement){sel=null;return panel()}
  sel=el;el.classList.add('ed-sel');panel();
}

function panel(){
  const P=$('#props');
  if(!sel){P.innerHTML='<p class="mut" style="margin:0">Bấm vào chữ để sửa trực tiếp. Bấm vào ảnh hoặc nút/liên kết để đổi thuộc tính.</p>';return}
  const a=sel.closest('a'),im=sel.tagName==='IMG'?sel:null;
  let h=`<div class="tag">&lt;${sel.tagName.toLowerCase()}&gt;</div>`;
  if(im)h+=`<img class="pv" src="${esc(im.src)}"><label>Đường dẫn ảnh<input id="p-src" value="${esc(im.getAttribute('src'))}"></label><label class="btn2">Tải ảnh lên<input id="p-up" type="file" accept="image/*" hidden></label><label>Mô tả (alt)<input id="p-alt" value="${esc(im.getAttribute('alt'))}"></label>`;
  if(a)h+=`<label>Liên kết (href)<input id="p-href" value="${esc(a.getAttribute('href'))}"></label>`;
  h+='<div class="row"><button id="p-par">↑ Phần tử cha</button><button id="p-dup">Nhân đôi</button><button id="p-del" class="danger">Xóa</button></div>';
  P.innerHTML=h;
  const on=(id,f)=>{const e=$(id);if(e)e.addEventListener('input',f)};
  on('#p-src',e=>{im.setAttribute('src',e.target.value);mark()});
  on('#p-alt',e=>{im.setAttribute('alt',e.target.value);mark()});
  on('#p-href',e=>{a.setAttribute('href',e.target.value);mark()});
  const up=$('#p-up');if(up)up.addEventListener('change',upload);
  $('#p-par').onclick=()=>pick(sel.parentElement);
  $('#p-dup').onclick=()=>{const c=sel.cloneNode(true);c.classList.remove('ed-sel');sel.after(c);pick(c);mark()};
  $('#p-del').onclick=()=>{if(confirm('Xóa phần tử này?')){const p=sel.parentElement;sel.remove();pick(p);mark()}};
}

async function upload(e){
  const f=e.target.files[0];if(!f)return;
  try{status('Đang tải ảnh…');
    const {url}=await (await api('/api/upload?name='+encodeURIComponent(f.name),{method:'POST',headers:H,body:f})).json();
    sel.setAttribute('src',url);mark();panel();
  }catch(x){status(x.message,1)}
}

/* SEO */
const M=(d,s)=>d.head.querySelector(s);
function fillSeo(){
  const d=fr.contentDocument,g=s=>(M(d,s)&&M(d,s).getAttribute('content'))||'';
  $('#s-title').value=d.title;$('#s-desc').value=g('meta[name=description]');
  $('#s-ogt').value=g('meta[property="og:title"]');$('#s-ogd').value=g('meta[property="og:description"]');
}
const setMeta=(s,v)=>{const m=M(fr.contentDocument,s);if(m)m.setAttribute('content',v)};
$('#s-title').oninput=e=>{const d=fr.contentDocument,og=M(d,'meta[property="og:title"]');
  if(og&&og.getAttribute('content')===d.title){og.setAttribute('content',e.target.value);$('#s-ogt').value=e.target.value}
  d.title=e.target.value;mark()};
$('#s-desc').oninput=e=>{const d=fr.contentDocument,og=M(d,'meta[property="og:description"]'),ds=M(d,'meta[name=description]');
  if(og&&ds&&og.getAttribute('content')===ds.getAttribute('content')){og.setAttribute('content',e.target.value);$('#s-ogd').value=e.target.value}
  setMeta('meta[name=description]',e.target.value);mark()};
$('#s-ogt').oninput=e=>{setMeta('meta[property="og:title"]',e.target.value);mark()};
$('#s-ogd').oninput=e=>{setMeta('meta[property="og:description"]',e.target.value);mark()};

/* Chế độ & lưu */
function setMode(m,init){
  if(!init&&m===mode)return;
  if(!init&&mode==='code'&&m==='visual'&&ta.value!==ta.dataset.orig)setSource(ta.value);
  if(!init&&m==='code'){ta.value=serialize();ta.dataset.orig=ta.value}
  mode=m;$('#wrap').hidden=m!=='visual';ta.hidden=m!=='code';
  $('#side2').style.visibility=m==='code'?'hidden':'visible';
  document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
}
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
document.querySelectorAll('#vp button').forEach(b=>b.onclick=()=>{fr.style.width=b.dataset.w;document.querySelectorAll('#vp button').forEach(x=>x.classList.toggle('on',x===b))});
ta.oninput=mark;

async function save(){
  if(!cur)return;
  const html=(mode==='code'||isCss())?ta.value:serialize();
  try{
    await api('/api/file?path='+encodeURIComponent(cur),{method:'POST',headers:{...H,'Content-Type':'text/plain; charset=utf-8'},body:html});
    dirty=false;status('✓ Đã lưu '+new Date().toLocaleTimeString('vi-VN'));loadHist();
  }catch(x){status('Lỗi: '+x.message,1)}
}
$('#save').onclick=save;
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();save()}});
addEventListener('beforeunload',e=>{if(dirty)e.preventDefault()});

/* Lịch sử sao lưu */
async function loadHist(){
  const {items}=await (await api('/api/backups?path='+encodeURIComponent(cur))).json();
  $('#hist').innerHTML=`<option value="">Lịch sử (${items.length})</option>`+items.map(i=>`<option value="${i}">${new Date(i.slice(0,10)+'T'+i.slice(11,19).replace(/-/g,':')+'Z').toLocaleString('vi-VN')}</option>`).join('');
}
$('#hist').onchange=async e=>{
  const id=e.target.value;if(!id)return;
  if(!confirm('Mở bản sao lưu này? Chưa ghi đè cho tới khi bạn bấm Lưu.')){e.target.value='';return}
  const t=await (await api('/api/backup?path='+encodeURIComponent(cur)+'&id='+encodeURIComponent(id))).text();
  if(mode==='code'||isCss())ta.value=t;else setSource(t);
  mark();e.target.value='';
};

/* Tìm & thay thế */
$('#rep').onclick=()=>{$('#r-out').textContent='';$('#dlg').showModal()};
$('#r-x').onclick=()=>$('#dlg').close();
async function rep(apply){
  const find=$('#r-find').value,out=$('#r-out');
  if(find.length<2){out.textContent='Nhập ít nhất 2 ký tự.';return}
  if(apply&&!confirm((dirty?'Trang đang mở có thay đổi chưa lưu — sẽ bị bỏ nếu trang này bị thay.\n':'')+'Ghi vào file (có sao lưu). Tiếp tục?'))return;
  try{
    const r=await (await api('/api/replace',{method:'POST',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({find,replace:$('#r-with').value,scope:$('#r-scope').value,apply})})).json();
    out.textContent=r.files.length?r.files.map(f=>f.count+' × '+f.path).join('\n')+'\n— '+(apply?'Đã thay ':'Sẽ thay ')+r.total+' chỗ':'Không tìm thấy.';
    if(apply&&r.files.some(f=>f.path===cur)){dirty=false;open(cur)}
  }catch(x){out.textContent=x.message}
}
$('#r-prev').onclick=()=>rep(false);$('#r-do').onclick=()=>rep(true);

init().catch(x=>status(x.message,1));
</script>
</body>
</html>
